name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-deploy.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1

defaults:
  run:
    working-directory: terraform

jobs:
  # ---------- On every PR: plan BOTH environments, one labeled comment each ----------
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC - no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840080485121:role/github-actions-fintech
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (env-scoped state)
        run: terraform init -backend-config="key=fintech/${{ matrix.env }}/terraform.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -var-file=environments/${{ matrix.env }}.tfvars -out=tfplan -no-color 2>&1 | tee plan.txt

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.substring(plan.length - 60000);
            }
            const body = `### Terraform Plan — \`${{ matrix.env }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>\n\n*Review the plan. Merging applies BOTH environments (dev first, then staging).*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ---------- On merge: apply dev FIRST, then staging (sequential, fail-fast) ----------
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        env: [dev, staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC - no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840080485121:role/github-actions-fintech
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init (env-scoped state)
        run: terraform init -backend-config="key=fintech/${{ matrix.env }}/terraform.tfstate"

      - name: Plan (saved)
        run: terraform plan -var-file=environments/${{ matrix.env }}.tfvars -out=tfplan

      - name: Apply saved plan
        run: terraform apply tfplan
