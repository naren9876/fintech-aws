name: App Build Scan Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-build-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: fintech-auth-service
  CONTAINER_NAME: auth-service

jobs:
  # ---------- BUILD ONCE: one certified image for every environment ----------
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Unit tests
        working-directory: app
        run: npx jest --passWithNoTests

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840080485121:role/github-actions-fintech
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (git-SHA tag)
        id: meta
        working-directory: app
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Trivy scan (CRITICAL/HIGH fail the build)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push to ECR
        run: |
          docker push "$IMAGE"
          docker tag "$IMAGE" "${{ steps.ecr.outputs.registry }}/${ECR_REPO}:latest"
          docker push "${{ steps.ecr.outputs.registry }}/${ECR_REPO}:latest"

  # ---------- DEPLOY EVERYWHERE: same image, dev first, then staging ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        env: [dev, staging]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840080485121:role/github-actions-fintech
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS (${{ matrix.env }})
        run: |
          CLUSTER="fintech-${{ matrix.env }}-cluster"
          SERVICE="fintech-${{ matrix.env }}-auth"
          TASK_FAMILY="fintech-${{ matrix.env }}-auth"
          IMAGE="${{ needs.build.outputs.image }}"

          if ! aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
               --query 'services[?status==`ACTIVE`]' --output text 2>/dev/null | grep -q .; then
            echo "[${{ matrix.env }}] ECS service not present yet. Image pushed; skipping deploy."
            exit 0
          fi

          echo "[${{ matrix.env }}] Registering task definition with $IMAGE"
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' > td.json

          jq --arg IMAGE "$IMAGE" --arg NAME "$CONTAINER_NAME" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
          ' td.json > td-new.json

          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" > /dev/null

          echo "[${{ matrix.env }}] Waiting for stability (circuit breaker rolls back on failure)..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Health verification (${{ matrix.env }})
        run: |
          CLUSTER="fintech-${{ matrix.env }}-cluster"
          SERVICE="fintech-${{ matrix.env }}-auth"

          if ! aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
               --query 'services[?status==`ACTIVE`]' --output text 2>/dev/null | grep -q .; then
            echo "[${{ matrix.env }}] No service yet - nothing to verify."
            exit 0
          fi

          ALB=$(aws elbv2 describe-load-balancers --names "fintech-${{ matrix.env }}-alb" \
            --query 'LoadBalancers[0].DNSName' --output text)

          echo "[${{ matrix.env }}] Verifying http://$ALB/health"
          for i in $(seq 1 10); do
            if curl -fsS "http://$ALB/health"; then
              echo ""
              echo "[${{ matrix.env }}] Deployment verified healthy."
              exit 0
            fi
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "[${{ matrix.env }}] Health verification FAILED."
          exit 1
